<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coleções — Victoria Ferrarini Joias</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:280px;gap:18px}
  .tile{position:relative;border-radius:24px;overflow:hidden;color:#fff;display:flex;align-items:flex-end;padding:26px}
  .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s}
  .tile:hover img{transform:scale(1.05)}
  .tile::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(15,12,8,.7));z-index:1}
  .tile .t{position:relative;z-index:2;width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .tile h3{font-size:34px;line-height:1}
  .tile small{display:block;font-size:13px;color:#EFE8DD;margin-top:6px}
  .tile .go{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:.3s}
  .tile:hover .go{background:var(--gold);color:#fff}
  .tile .go svg{width:18px;height:18px}
  .tile.big{grid-column:span 2;grid-row:span 2}
  .tile.big h3{font-size:52px}
  .tile.wide{grid-column:span 2}
  @media (max-width:1100px){.bento{grid-template-columns:repeat(2,1fr);grid-auto-rows:240px}}
  @media (max-width:680px){.bento{grid-template-columns:1fr 1fr;grid-auto-rows:190px;gap:10px}.tile{padding:16px;border-radius:18px}.tile h3{font-size:22px}.tile.big h3{font-size:34px}.tile .go{display:none}.tile.big,.tile.wide{grid-column:span 2}}
</style>
</head>
<body data-page="colecoes">
<div id="site-header"></div>

<section class="page-hero light">
  <div class="wrap" style="padding-top:56px;padding-bottom:44px">
    <nav class="crumbs"><a href="index.html">Início</a> / <span>Coleções</span></nav>
    <h1>Nossas coleções</h1>
    <p>Joias à prova d'água, hipoalergênicas e com garantia vitalícia. Escolha por categoria ou por destaque.</p>
  </div>
</section>

<main class="wrap section tight">
  <div class="bento" id="bento"></div>
  <div style="text-align:center;margin-top:40px"><a class="btn btn-line" href="colecao.html?c=todos">Ver todas as joias</a></div>
</main>

<div data-benefits></div>
<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const { COLS, col, img, url, I, qs } = VF;
  const order = [["lancamentos", "big"], ["mais-vendidos", ""], ["em-promocao", ""], ["aneis", ""], ["brincos", ""], ["colares", "wide"], ["pulseiras-e-braceletes", ""], ["joias-pedras-naturais", ""], ["tornozeleiras", ""], ["monte-se-mix", "wide"]];
  qs("#bento").innerHTML = order.map(([h, cls]) => { const c = COLS[h];
    return `<a class="tile ${cls}" href="${url.c(h)}"><img loading="lazy" src="${img(c.b, cls ? 1200 : 700)}" alt=""><div class="t"><div><h3>${c.n}</h3><small>${col(h).length} peças</small></div><span class="go">${I.arrow}</span></div></a>`; }).join("");
});
</script>
</body>
</html>
