<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacola — Victoria Ferrarini Joias</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .steps{display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:600;color:var(--muted);margin:36px 0 28px}
  .steps span{display:flex;align-items:center;gap:8px}
  .steps i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--sand-2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px}
  .steps .on{color:var(--ink)}
  .steps .on i{background:var(--ink);border-color:var(--ink);color:#fff}
  .steps hr{flex:0 0 40px;border:0;border-top:1.5px dashed var(--sand-2)}
  .cart{display:grid;grid-template-columns:1fr 400px;gap:48px;align-items:start}
  .cart h1{font-size:44px;margin-bottom:22px}
  .cart .line{grid-template-columns:110px 1fr auto;gap:20px;padding:22px 0}
  .cart .line .ph{width:110px;height:110px}
  .cart .line h4{font-size:16px}
  .meters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
  .meters .meter{margin:0}
  .summary{background:#fff;border:1px solid var(--sand-2);border-radius:24px;padding:28px;position:sticky;top:100px}
  .summary h3{font-size:28px;margin-bottom:18px}
  .cep{display:flex;gap:8px;margin:16px 0}
  .cep input,.coupon input{flex:1;border:1px solid var(--sand-2);border-radius:12px;padding:12px 14px;outline:none;min-width:0}
  .cep button,.coupon button{border:1.5px solid var(--ink);border-radius:12px;padding:0 16px;font-weight:600;font-size:14px}
  .coupon{display:flex;gap:8px;margin-bottom:16px}
  .cep-res{font-size:13px;color:var(--ink-2);margin:-6px 0 14px}
  .sec{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted);margin-top:14px}
  .sec svg{width:16px;height:16px}
  hr.sp{border:0;border-top:1px solid var(--sand-2);margin:14px 0}
  .upsell{margin-top:40px}
  .upsell h3{font-size:28px;margin-bottom:18px}
  .upsell .grid{grid-template-columns:repeat(4,1fr);gap:16px}
  .upsell .card h4{font-size:13.5px}
  @media (max-width:1000px){.cart{grid-template-columns:1fr}.summary{position:static}}
  @media (max-width:680px){
    .meters{grid-template-columns:1fr}
    .cart h1{font-size:36px}
    .cart .line{grid-template-columns:80px 1fr auto;gap:12px}
    .cart .line .ph{width:80px;height:80px}
    .upsell .grid{grid-template-columns:1fr 1fr}
    .steps{font-size:12px;gap:6px}.steps hr{flex-basis:14px}
  }
</style>
</head>
<body data-page="carrinho">
<div id="site-header"></div>
<main class="wrap">
  <div class="steps"><span class="on"><i>1</i>Sacola</span><hr><span><i>2</i>Identificação</span><hr><span><i>3</i>Pagamento</span></div>
  <div id="cartPage"></div>
</main>
<section class="section"></section>
<div data-benefits="light"></div>
<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const { qs, cart, totals, meters, lineHTML, brl, inst, I, col, cardHTML, toast } = VF;
  let cepMsg = "";
  function render() {
    const t = totals(), c = cart();
    if (!t.count) {
      qs("#cartPage").innerHTML = `<div class="empty" style="padding:80px 0">${I.bag}<h1 style="font-size:44px;margin-bottom:10px">Sua sacola está vazia</h1><p>Explore nossas coleções e encontre a sua próxima joia favorita.</p>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px"><a class="btn btn-dark" href="colecao.html?c=mais-vendidos">Ver mais vendidos</a><a class="btn btn-line" href="colecao.html?c=lancamentos">Lançamentos</a></div></div>
        <div class="upsell"><h3>Sugestões para você</h3><div class="grid">${col("mais-vendidos").filter(p => p.a).slice(0, 4).map(cardHTML).join("")}</div></div>`;
      return;
    }
    const inCart = new Set(c.map(l => l.h));
    const ups = col("monte-se-mix").filter(p => p.a && !inCart.has(p.h)).sort((a, b) => a.p - b.p).slice(0, 4);
    qs("#cartPage").innerHTML = `<div class="cart">
      <div>
        <h1>Sua sacola <span class="muted" style="font-family:var(--sans);font-size:18px">(${t.count} ${t.count > 1 ? "peças" : "peça"})</span></h1>
        <div class="meters">${meters(t)}</div>
        ${c.map(lineHTML).join("")}
        <a class="link-arrow" style="margin-top:22px" href="colecoes.html">← Continuar comprando</a>
        ${ups.length ? `<div class="upsell"><h3>Complete seu pedido</h3><div class="grid">${ups.map(cardHTML).join("")}</div></div>` : ""}
      </div>
      <aside class="summary">
        <h3>Resumo</h3>
        <div class="sumrow"><span>Subtotal (${t.count} ${t.count > 1 ? "itens" : "item"})</span><span>${brl(t.sub)}</span></div>
        ${t.tier ? `<div class="sumrow"><span>Desconto atacado (${t.tier}%)</span><span class="disc">− ${brl(t.disc)}</span></div>` : ""}
        <div class="sumrow"><span>Frete</span><span>${t.ship === 0 ? '<span class="disc">Grátis</span>' : "Calcule abaixo"}</span></div>
        <div class="cep"><input id="cep" inputmode="numeric" maxlength="9" placeholder="Digite seu CEP"><button id="cepBtn">Calcular</button></div>
        ${cepMsg ? `<div class="cep-res">${cepMsg}</div>` : ""}
        <div class="coupon"><input placeholder="Cupom de desconto"><button id="cpBtn">Aplicar</button></div>
        <hr class="sp">
        <div class="sumrow total"><span>Total</span><span>${brl(t.total)}</span></div>
        <p class="inst" style="text-align:right">${inst(t.total)}</p>
        <p class="inst" style="text-align:right;color:var(--green);font-weight:600;margin-bottom:18px">+ ${brl(t.cashback)} de cashback na próxima compra</p>
        <button class="btn btn-dark btn-block" id="checkout">Finalizar compra ${I.arrow}</button>
        <div class="sec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Compra 100% segura · Pix, cartão e boleto</div>
      </aside>
    </div>`;
  }
  render();
  document.addEventListener("cart:change", render);
  qs("#cartPage").addEventListener("click", e => {
    if (e.target.id === "cepBtn") {
      const v = qs("#cep").value.replace(/\D/g, "");
      const t = totals();
      cepMsg = v.length !== 8 ? "Digite um CEP válido com 8 números." : t.total >= 199 ? "✓ Frete grátis para o seu CEP · envio em até 2 dias úteis." : `Faltam ${brl(199 - t.total)} para frete grátis. Opções de frete aparecem no checkout.`;
      render(); qs("#cep").value = v.replace(/(\d{5})(\d)/, "$1-$2");
    }
    if (e.target.id === "cpBtn") toast("Não precisa de cupom: os descontos já são aplicados automaticamente.");
    if (e.target.closest("#checkout")) toast("Protótipo: no site real, esta etapa leva ao checkout seguro da loja.");
  });
});
</script>
</body>
</html>
